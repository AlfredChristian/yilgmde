# Paramètres PROPRES à Ouagadougou. [H] = hypothèse / à affiner.

ville: Ouagadougou
pays: BF
devise: XOF
crs_geographique: EPSG:4326       # latitude / longitude
crs_metrique: EPSG:32630          # UTM 30N, pour calculer des distances en mètres

zone_etude:
  # Emprise de la commune : 551 km² (RGPH 2019 : 2 415 266 hab., 4 385,5 hab./km²) autour du
  # centre-ville, avec une marge ; couvre les secteurs de data/ouaga/zones.geojson.
  bbox: {min_lat: 12.24, max_lat: 12.50, min_lon: -1.65, max_lon: -1.39}

collecte:
  # Dépôt / centre de traitement où partent et se vident les camions.
  # [H] position approximative du centre de traitement de Polesgo (nord-est) : À CONFIRMER avec la mairie.
  depot: {latitude: 12.43, longitude: -1.47}

secteur_equipe: null              # à renseigner : secteur de collecte attribué à notre équipe

population_totale: null           # à renseigner (source : recensement / mairie)

sources_donnees:
  - OpenStreetMap (ODbL)
  - Open Buildings
  - Signalements collectés par l'équipe dans son secteur
  - Paramètres de départ fixés avec la mairie (à obtenir)
