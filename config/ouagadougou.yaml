# Paramètres PROPRES à Ouagadougou. [H] = hypothèse / à affiner.

ville: Ouagadougou
pays: BF
devise: XOF
crs_geographique: EPSG:4326       # latitude / longitude
crs_metrique: EPSG:32630          # UTM 30N, pour calculer des distances en mètres

zone_etude:
  # Emprise de la commune : 551 km² (RGPH 2019 : 2 415 266 hab., 4 385,5 hab./km²) autour du
  # centre-ville, avec une marge ; couvre les secteurs de data/ouaga/zones.geojson.
  bbox: {min_lat: 12.24, max_lat: 12.50, min_lon: -1.65, max_lon: -1.39}

# Données fictives mais réalistes autorisées par les organisateurs : chaque valeur réelle a sa
# source, chaque valeur inventée est marquée [H]. Sources détaillées : data/ouaga/LISEZMOI.md.

population_totale: 2415266        # INSD, RGPH 2019 (monographie de Ouagadougou, tableau 2.2)

population:
  production_dechets_kg_hab_jour: 0.60   # DGEP, cité par Sidwaya ; la mairie donne 0,57 (0,21 t/hab/an)
  taux_abonnement_precollecteurs: 0.3    # [H]

collecte:
  # Centre de traitement et de valorisation des déchets (CTVD) de Polesgo, nord-est de la ville.
  # [H] position approximative.
  depot: {latitude: 12.43, longitude: -1.47}
  frequence_passages_par_semaine: 2      # UN-Habitat : 2 fois/semaine en quartier résidentiel (3 au centre)
  jours_ouvres_par_semaine: 6            # [H] un passage s'étale sur 6 / 2 = 3 jours (D39)

precollecteurs:                          # [H] associations de pré-collecte (charrettes, tricycles)
  nombre: 1000
  capacite_kg_jour: 300
  abonnement_mensuel_xof: 1000

laabal:
  nombre_brigades: 3                     # [H]
  capacite_eradication_par_jour: 4       # [H]

mairie:
  budget_mensuel_xof: 110000000          # [H] ≈ 1,3 milliard XOF/an ; plan d'un arrondissement : sa part (D39)

# [H] 70 bennes de 10 t (ids camion_1 à camion_70, qui remplacent les 3 camions de default.yaml).
# Avec 70 camions, la commune entière est collectée à ~79 % ; 90 camions donnent 100 %.
# Coût au km : carburant et entretien ; coût journalier : équipage de 3 personnes.
