# Paramètres GÉNÉRIQUES (réutilisables par n'importe quelle commune).
# [H] = HYPOTHÈSE de départ, sans source établie : à ajuster avec la mairie ou des données réelles.

scenario:
  nom: base
  saison: seche              # seche | pluies
  horizon_jours: 30          # durée de la simulation
  graine_aleatoire: 42       # reproductibilité

population:
  habitants_par_menage: 6                # [H]
  production_dechets_kg_hab_jour: 0.5    # [H]
  taux_abonnement_precollecteurs: 0.3    # [H] part des ménages abonnés à un pré-collecteur

saisons:
  seche:  {coef_production: 1.0, coef_vitesse_camion: 1.0, coef_depots_sauvages: 1.0}
  pluies: {coef_production: 1.1, coef_vitesse_camion: 0.7, coef_depots_sauvages: 1.2}   # [H]

verification:
  rayon_doublon_m: 30                    # signalements plus proches = doublon probable
  max_signalements_par_appareil_heure: 5
  photo_requise: false
  photo_taille_max_mo: 5                 # [H] au-delà, la photo est refusée (HTTP 413)
  penalite_doublon: 0.3                  # [H] retranchée du score si un signalement proche existe déjà
  penalite_depotoir_proche: 0.1          # [H] retranchée du score si un dépotoir connu est proche
  seuil_confiance_appareil: 0.3          # [H] en dessous, l'appareil est jugé peu fiable
  penalite_appareil_peu_fiable: 0.2      # [H]

points_regroupement:
  capacite_kg: 3000                      # [H]
  distance_max_a_pied_m: 300             # [H]
  couverture_cible: 0.95                 # [H] part de la zone à moins de distance_max_a_pied_m d'un point
  max_points_par_zone: 60                # [H] borne le calcul ; au-delà, la zone est signalée mal couverte
  poids_depotoir: 5                      # [H] attraction d'un dépotoir actif sur le placement (1 = un échantillon de ménages)
  pas_echantillonnage_m: 100             # résolution de la grille des ménages (agrandie si > max_echantillons_par_zone)
  max_echantillons_par_zone: 2000        # borne le temps de calcul

camions:
  - {id: camion_1, capacite_kg: 6000, cout_km_xof: 400, cout_jour_xof: 15000, disponible: true}   # [H]
  - {id: camion_2, capacite_kg: 6000, cout_km_xof: 400, cout_jour_xof: 15000, disponible: true}   # [H]
  - {id: camion_3, capacite_kg: 6000, cout_km_xof: 400, cout_jour_xof: 15000, disponible: true}   # [H]

collecte:
  frequence_passages_par_semaine: 2      # [H]
  vitesse_moyenne_kmh: 20                # [H]
  coef_detour: 1.3                       # [H] distance routière ≈ vol d'oiseau × coef
  temps_arret_min: 10                    # [H] chargement d'un point de regroupement
  duree_max_tournee_min: 480             # [H] journée de travail d'un camion
  rotations_max_par_jour: 2              # [H] allers-retours au dépôt (vidage) par camion et par jour
  temps_calcul_max_s: 5                  # sécurité : au-delà, meilleure solution trouvée
  # depot: {latitude: ..., longitude: ...}   # propre à chaque commune : voir <ville>.yaml

precollecteurs:
  nombre: 20                             # [H]
  abonnement_mensuel_xof: 1000           # [H]
  capacite_kg_jour: 150                  # [H]

laabal:
  nombre_brigades: 1                     # [H]
  capacite_eradication_par_jour: 2       # [H] dépotoirs traités par jour
  frequence_surveillance_jours: 7        # [H]
  taux_controle: 0.3                     # [H] probabilité de constater un dépôt en zone surveillée
  montant_amende_xof: 10000              # [H]
  effet_dissuasion: 0.3                  # [H] réduction de la probabilité de dépôt sauvage en zone surveillée
  temps_intervention_min: 60             # [H] durée d'une éradication sur place
  # base: {latitude: ..., longitude: ...}  # départ des brigades ; par défaut collecte.depot
  priorite:                              # [H] ordre de traitement des dépotoirs illégaux
    poids_volume: {petit: 1, moyen: 2, gros: 3}
    poids_reapparition: 2                # un dépotoir qui revient est traité en priorité
    poids_signalement: 0.5

simulation:                              # E1–E4, voir simulation/agents.py
  prob_apport_volontaire: 0.6            # [H] un ménage non abonné à distance de marche apporte ses déchets au point
  seuil_nouveau_depotoir_kg: 1500        # [H] dépôts sauvages du jour dans une zone pour qu'un dépotoir apparaisse à coup sûr
  prob_reapparition: 0.05                # [H] par jour, pour un site sous surveillance (× (1 − effet_dissuasion))
  prob_tentative_depot_surveille: 0.1    # [H] par jour, tentative de dépôt sur un site surveillé (contrôlable)
  jours_par_mois: 30                     # répartition du budget mensuel
  max_echantillons_couverture: 400       # borne le calcul de la couverture à pied

mairie:
  budget_mensuel_xof: 5000000            # [H]

securite:
  duree_token_min: 480                   # [H] durée de validité d'une connexion (8 h)
